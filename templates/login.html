{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="card auth"><h1>Secure sign in</h1>
<form method="post" class="stack"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Username<input name="username" required autofocus autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button>Sign in</button></form>
<p class="muted">New staff? <a href="{{ url_for('auth.register') }}">Request an account</a></p></div>
{% endblock %}
